            function updateCategorySeo(category){
                const seo = categorySeo[category];

                if(!seo) return;

                const categoryUrl =
                `https://tt-farm.com/gallery.html?category=${encodeURIComponent(category)}`;

                document.title = seo.title;

                document.querySelector('meta[name="description"]')
                .setAttribute("content", seo.description);

                document.querySelector('link[rel="canonical"]')
                .setAttribute("href", categoryUrl);

                document.querySelector('meta[property="og:title"]')
                .setAttribute("content", seo.title);

                document.querySelector('meta[property="og:description"]')
                .setAttribute("content", seo.description);

                document.querySelector('meta[property="og:url"]')
                .setAttribute("content", categoryUrl);

                document.querySelector('meta[property="og:image"]')
                .setAttribute("content", seo.ogImage);
            }

            function resetGallerySeo(){
                document.title =
                "ギャラリー｜T.Tファーム｜長野県・信州の農園写真";

                document.querySelector('meta[name="description"]').setAttribute(
                    "content",
                    "T.Tファームのギャラリーです。長野県・信州で育てるぶどう、原木しいたけ、小麦、大豆、米、もも、山菜、小菊、ひまわりの写真や農園で出会った生き物をご紹介します。"
                );

                document.querySelector('link[rel="canonical"]')
                .setAttribute("href", "https://tt-farm.com/gallery.html");

                document.querySelector('meta[property="og:title"]')
                .setAttribute("content", "ギャラリー｜T.Tファーム");

                document.querySelector('meta[property="og:description"]').setAttribute(
                    "content",
                    "ぶどう、原木しいたけ、小麦、大豆、米、もも、山菜、小菊、ひまわりの栽培風景や、農園で出会った生き物をご紹介します。"
                );

                document.querySelector('meta[property="og:url"]')
                .setAttribute("content", "https://tt-farm.com/gallery.html");

                document.querySelector('meta[property="og:image"]')
                .setAttribute("content", "https://tt-farm.com/images/shiitake.jpg");
            }

            const params = new URLSearchParams(window.location.search);
            const initialCategory = params.get("category");

            let coverData = {};

            Promise.all([
                fetch(galleryApi).then(response => response.json()),
                fetch(diaryCsvUrl).then(response => response.text())
            ])
            
            .then(([gallery, csv]) => {
                coverData = gallery;
                diaryCategories = csv
                    .trim()
                    .split("\n")
                    .slice(1)
                    .map(row => row.split(",")[1])
                    .filter(category => category);
            
                if(initialCategory && categoryNames[initialCategory]){
                    showGallery(initialCategory);
                }else{
                showCategoryTop();
                }
            })
            .catch(error => {
                document.getElementById("gallery").innerHTML =
                    "<p>ギャラリーを読み込めませんでした。</p>";
                    console.error(error);
            });                     

            function showCategoryTop(){
                const gallery = document.getElementById("gallery");
                const title = document.querySelector(".page-title");
                const description = document.getElementById("gallery-description");
                resetGallerySeo();
                resetGalleryBreadcrumb();
                title.textContent = "ギャラリー";
                description.textContent = "T.Tファームで育てている作物や、農園で出会った生き物、信州の自然を写真でご紹介します。気になるカテゴリーを選んでご覧ください。";
                history.replaceState({},"","gallery.html");
                gallery.innerHTML = "";
                
                const sortedCategories=
                Object.keys(categoryNames).sort((a,b) => {
                    const aHas = coverData[a] !== null && coverData[a] !== undefined;
                    const bHas = coverData[b] !== null && coverData[b] !== undefined;

                    if(aHas && !bHas) return -1;
                    if(!aHas && bHas) return 1;

                    return 0;
                });

                sortedCategories.forEach(category => {
                    const cover = coverData[category];
                    if(!cover){
                        gallery.innerHTML += `
                            <div class="photo-card empty-card">
                                <a class="category-only" href="gallery.html?category=${encodeURIComponent(category)}">
                                    ${categoryNames[category]}
                                </a>
                            </div>
                        `;
                        return;
                    }

                    gallery.innerHTML += `
                        <a class="photo-card category-card" href="gallery.html?category=${encodeURIComponent(category)}">
                            <img src="${cover.url}" alt="${categoryNames[category]}の写真">
                            <p>${categoryNames[category]}</p>
                        </a>
                    `;
                });
            }

            function showGallery(category){
                const seo = categorySeo[category];

                if(!seo){
                    showCategoryTop();
                    return;
                }

                const gallery = document.getElementById("gallery");
                const title = document.querySelector(".page-title");
                const description =
                    document.getElementById("gallery-description");

                updateCategorySeo(category);

                updateGalleryBreadcrumb(category);

                title.textContent = seo.h1;
                description.textContent = seo.text;

                history.pushState(
                    {},
                    "",
                    `gallery.html?category=${encodeURIComponent(category)}`
                );

                const diaryCategory =
                    category === "shiitake"
                    ? "しいたけ"
                    : categoryNames[category];

                const hasDiary =
                diaryCategories.includes(diaryCategory);

                gallery.innerHTML = `
                    <div class="gallery-heading">
                    <h2>${seo.h2}</h2>

                    <button class="back-button"
                        onclick="showCategoryTop()">
                        ← ギャラリー一覧へ戻る
                    </button>

                    ${
                    hasDiary
                        ? `
                        <a class="diary-link"
                           href="diary.html?category=${encodeURIComponent(diaryCategory)}">
                            この作物の農園日記を見る
                        </a>
                    `
                    : ""
                    }
                    </div>

                    <p class="gallery-loading">
                        読み込み中…
                    </p>
                `;

                fetch(`${galleryApi}?mode=category&category=${encodeURIComponent(category)}`)
                .then(response => {
                if(!response.ok){
                    throw new Error("写真を取得できませんでした。");
                }

                return response.json();
                })
                .then(photos => {
                    photos.sort((a,b) => {
                    if(a.isCover && !b.isCover) return -1;
                    if(!a.isCover && b.isCover) return 1;

                    return a.name.localeCompare(b.name, "ja");
                    });

                    currentPhotos = photos.map(photo => ({
                    ...photo,
                    alt:
                    `${categoryNames[category]}|${photo.name}｜T.Tファーム`
                }));

                const photoHtml = currentPhotos.map((photo, index) => `
                    <div class="photo-card">
                        <img
                            src="${photo.url}"
                            alt="${photo.alt}"
                            loading="lazy"
                            onclick="openLightbox(${index})"
                            style="cursor:zoom-in;"
                        >
                        <p>${photo.name}</p>
                        </div>
                    `).join("");

                    gallery.innerHTML = `
                        <div class="gallery-heading">
                        <h2>${seo.h2}</h2>

                        <button class="back-button"
                            onclick="showCategoryTop()">
                            ← ギャラリー一覧へ戻る
                        </button>

                        ${
                            hasDiary
                                ? `
                                    <a class="diary-link"
                                        href="diary.html?category=${encodeURIComponent(diaryCategory)}">
                                        この作物の農園日記を見る
                                    </a>
                                `
                            : ""
                        }
                    </div>

                    ${
                        photoHtml ||
                        `<p class="gallery-loading">
                            写真は現在準備中です。
                        </p>`
                    }
                    `;
                })
                .catch(error => {
                    gallery.innerHTML = `
                        <div class="gallery-heading">
                        <h2>${seo.h2}</h2>

                        <button class="back-button"
                            onclick="showCategoryTop()">
                            ← ギャラリー一覧へ戻る
                        </button>
                        </div>

                        <p class="gallery-loading">
                        写真を読み込めませんでした。
                        </p>
                        `;

                    console.error(error);
                });
            }          

            let currentPhotos = [];
            let currentIndex = 0;

            function openLightbox(index){

                currentIndex = index;

                document.getElementById("lightbox").classList.add("open");

                showLightboxPhoto();
            }

            function showLightboxPhoto(){

                const photo = currentPhotos[currentIndex];
                const lightboxImg = document.getElementById("lightbox-img");

                lightboxImg.src = photo.url;
                lightboxImg.alt = photo.alt || photo.name;

                document.getElementById("lightbox-caption").textContent =
                    photo.name + "　(" + (currentIndex+1) + " / " + currentPhotos.length + ")";
            }

            function closeLightbox(){

                document.getElementById("lightbox").classList.remove("open");
            }

            function nextPhoto(){

                currentIndex++;

                if(currentIndex >= currentPhotos.length){
                    currentIndex = 0;
                }

                showLightboxPhoto();
            }

            function prevPhoto(){

                currentIndex--;

                if(currentIndex < 0){
                    currentIndex = currentPhotos.length-1;
                }

                showLightboxPhoto();
            }

            document.addEventListener("keydown",e=>{

                if(!document.getElementById("lightbox").classList.contains("open")) return;

                if(e.key==="ArrowRight") nextPhoto();

                if(e.key==="ArrowLeft") prevPhoto();

                if(e.key==="Escape") closeLightbox();

            });

            let touchStartX = 0;
            let touchEndX = 0;

            const lightbox = document.getElementById("lightbox");

            lightbox.addEventListener("touchstart", function(e){
                touchStartX = e.changedTouches[0].screenX;
            });

            lightbox.addEventListener("touchend", function(e){
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            });

            function handleSwipe(){
                const swipeDistance = touchEndX - touchStartX;

                if(Math.abs(swipeDistance) < 50){
                    return;
                }

                if(swipeDistance < 0){
                    nextPhoto();
                }else{
                    prevPhoto();
                }
            }

            

            function updateGalleryBreadcrumb(category){
                const categoryWrap = document.getElementById("breadcrumb-category-wrap");
                const categoryText = document.getElementById("breadcrumb-category");
                const label = categoryNames[category];
                categoryText.textContent = label;
                categoryWrap.style.display = "inline";
                const categoryUrl = `https://tt-farm.com/gallery.html?category=${encodeURIComponent(category)}`;
                const breadcrumbData = {
                    "@context":"https://schema.org",
                    "@type":"BreadcrumbList",
                    "itemListElement":[
                        {
                            "@type":"ListItem",
                            "position":1,
                            "name":"ホーム",
                            "item":"https://tt-farm.com/"
                        },
                        {
                            "@type":"ListItem",
                            "position":2,
                            "name":"ギャラリー",
                            "item":"https://tt-farm.com/gallery.html"
                        },
                        {
                            "@type":"ListItem",
                            "position":3,
                            "name":label,
                            "item":categoryUrl
                        }
                    ]
                };
                document.getElementById("breadcrumb-json").textContent = JSON.stringify(breadcrumbData);

            }

            function resetGalleryBreadcrumb(){
                document.getElementById(
                    "breadcrumb-category-wrap"
                ).style.display = "none";
            
                const breadcrumbData = {
                    "@context":"https://schema.org",
                    "@type":"BreadcrumbList",
                    "itemListElement":[
                        {
                            "@type":"ListItem",
                            "position":1,
                            "name":"ホーム",
                            "item":"https://tt-farm.com/"
                        },
                        {
                            "@type":"ListItem",
                            "position":2,
                            "name":"ギャラリー",
                            "item":"https://tt-farm.com/gallery.html"
                        }
                    ]
                };
                document.getElementById("breadcrumb-json").textContent = JSON.stringify(breadcrumbData);
            }

        </script>

        <script src="js/common.js"></script>

    </body>
</html>
